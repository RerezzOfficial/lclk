<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinta 78</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #e0f7fa 0%, #ffe4ec 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .profile-card {
      max-width: 680px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 188, 212, 0.18), 0 8px 20px rgba(255, 105, 180, 0.12);
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .cover {
      height: 160px;
      background-image: url('https://files.catbox.moe/0snnok.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    .avatar-wrapper {
      display: flex;
      justify-content: center;
      margin-top: -58px;
      position: relative;
      z-index: 2;
    }

    .avatar {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      border: 5px solid #ffffff;
      box-shadow: 0 8px 18px rgba(0, 188, 212, 0.28);
      background: #e0f7fa;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-info {
      text-align: center;
      padding: 12px 20px 8px;
    }

    .name-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .name {
      font-size: 1.85rem;
      font-weight: 700;
      color: #2a4a52;
      letter-spacing: -0.3px;
    }

    .verified {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: #1d9bf0;
      border-radius: 50%;
      color: white;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(29, 155, 240, 0.3);
      transition: 0.1s;
    }

    .verified svg {
      width: 16px;
      height: 16px;
      fill: white;
    }

    .bio {
      color: #4a6b73;
      font-size: 0.98rem;
      line-height: 1.5;
      max-width: 400px;
      margin: 20px auto 14px;
      font-weight: 400;
      background: #f0fbfd;
      padding: 20px 20px;
      border-radius: 8px;
      display: inline-block;
      box-shadow: inset 0 1px 4px rgba(128, 222, 234, 0.4);
      border: 1px solid #d4f3f7;
    }

    .link-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 380px;
      margin: 6px auto 18px;
      padding: 0 16px;
    }

    .link-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      background: #f0fbfd;
      border: 1px solid #d4f3f7;
      border-radius: 8px;
      text-decoration: none;
      color: #2a5a63;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(128, 222, 234, 0.15);
    }

    .link-item:hover {
      background: #ffffff;
      border-color: #80deea;
      color: #007b8a;
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(128, 222, 234, 0.3);
    }

    .link-item i {
      font-size: 1.3rem;
      width: 24px;
      text-align: center;
    }

    .link-wa i { color: #25D366; }
    .link-ig i { color: #E1306C; }
    .link-tt i { color: #000000; }
    .link-reg i { color: #ff6b9d; }
    .link-ch i { color: #25D366; }
    .link-phone i { color: #34b7f1; }

    .link-item span {
      flex: 1;
      text-align: left;
    }

    .link-item .arrow {
      color: #b0dde3;
      font-size: 0.9rem;
      transition: transform 0.2s;
    }

    .link-item:hover .arrow {
      color: #4dd0e1;
      transform: translateX(3px);
    }

    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #80deea, #ffb0c8);
      border-radius: 10px;
      margin: 4px auto 14px;
    }

    @media (max-width: 480px) {
      .profile-card {
        border-radius: 20px;
      }

      .name {
        font-size: 1.5rem;
      }

      .avatar {
        width: 96px;
        height: 96px;
      }

      .avatar-wrapper {
        margin-top: -48px;
      }

      .bio {
        font-size: 0.9rem;
        padding: 8px 16px;
      }

      .link-section {
        padding: 0 12px;
      }

      .link-item {
        padding: 9px 14px;
        font-size: 0.88rem;
      }

      .link-item i {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>
  <div class="profile-card">
    <div class="cover"></div>

    <div class="avatar-wrapper">
      <div class="avatar">
        <img src="https://files.catbox.moe/cxl0hz.jpeg" alt="Foto Profil">
      </div>
    </div>

    <div class="profile-info">
      <div class="name-row">

          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

          </svg>
        </span>
      </div>

      <div class="bio">
        ✨  ARENA BERMAIN BOS MUDA  CUMAN DI CINTA78 TUK BURUAN DAFTAR SEBELUM KETINGGALAN BOSKU 🐉
      </div>

      <div class="link-section">
        <a href="https://cnta78.com/lclk" class="link-item link-reg" target="_blank" rel="noopener">
          <i class="bi bi-person-plus-fill"></i>
          <span>Link Daftar</span>

        </a>
        <a href="https://chat.whatsapp.com/J5s95eiXbEV7ktJBRvauLb" class="link-item link-wa" target="_blank" rel="noopener">
          <i class="bi bi-whatsapp"></i>
          <span>Grup WhatsApp</span>
          <i class="bi bi-arrow-right arrow"></i>
        </a>
        <a href="https://whatsapp.com/channel/0029VbDdcTf8KMqlpcLXz33D" class="link-item link-ch" target="_blank" rel="noopener">
          <i class="bi bi-broadcast"></i>
          <span>Saluran WhatsApp</span>
          <i class="bi bi-arrow-right arrow"></i>
        </a>
        <a href="https://wa.me/66953944001" class="link-item link-phone" target="_blank" rel="noopener">
          <i class="bi bi-telephone-fill"></i>
          <span>WhatsApp 1</span>
          <i class="bi bi-arrow-right arrow"></i>
        </a>
        <a href="https://wa.me/639758337395" class="link-item link-phone" target="_blank" rel="noopener">
          <i class="bi bi-telephone-fill"></i>
          <span>WhatsApp 1</span>
          <i class="bi bi-arrow-right arrow"></i>
        </a>
      </div>
    </div>

    <div class="divider"></div>

  </div>
</body>
</html>
